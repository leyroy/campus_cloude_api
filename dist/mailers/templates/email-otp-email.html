<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Cloude - Email Verification</title>
</head>

<body style="margin: 0; padding: 5px; font-family: Arial, sans-serif; background: #f4f4f7;">
  <table width="100%" bgcolor="#f4f4f7" cellpadding="0" cellspacing="0" style="padding: 10px 0;">
    <tr>
      <td align="center">
        <table width="100%"
          style="max-width: 580px; background: #ffffff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);"
          cellpadding="20" cellspacing="0">

          <!-- Logo -->
          <tr>
            <td align="center" style="padding-bottom: 10px;">
              <img src="https://via.placeholder.com/150x50?text=Campus+Cloude" alt="Campus Cloude Logo"
                style="display: block; max-width: 150px;" />
            </td>
          </tr>

          <!-- Illustration -->
          <tr>
            <td align="center" style="padding-bottom: 15px;">
              <img src="https://cdn-icons-png.flaticon.com/512/1048/1048933.png" alt="OTP Icon" width="70" height="70"
                style="display: block;" />
            </td>
          </tr>

          <!-- Heading & Message -->
          <tr>
            <td align="center" style="color: #333333;">
              <h2 style="margin: 0; font-size: 20px;">Verify Your Email</h2>
              <p style="margin: 8px 0 16px; font-size: 14px;">
                Here's your Campus Cloude verification code:
              </p>
            </td>
          </tr>

          <!-- OTP Code -->
          <tr>
            <td align="center">
              <div
                style="font-size: 24px; letter-spacing: 6px; font-weight: bold; background: #f0f2f5; padding: 10px 20px; border-radius: 6px;">
                827361
              </div>
              <p style="margin: 8px 0 0; font-size: 12px; color: #777;">
                Expires in 10 minutes.
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="font-size: 11px; color: #999999; padding-top: 15px;">
              Didn't request this? No worries. Just ignore it.
              <br />
              &copy; 2025 Campus Cloude
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>

</html>
